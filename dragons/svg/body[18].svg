<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512"
     shape-rendering="geometricPrecision">
<defs>
  <!-- Lagy tonusatmenet. Szandekosan nem megy le a legsotetebb arnyekig:
       a kemeny sotet foltok a format nem terfogatosnak, hanem koszosnak
       mutatjak. A melyebb arnyekot kulon retegek adjak. -->
  <linearGradient id="b18-vol" x1="0.18" y1="0.02" x2="0.82" y2="1">
    <stop offset="0"    stop-color="#e2e2e2"/>
    <stop offset="0.30" stop-color="#bdbdbd"/>
    <stop offset="0.66" stop-color="#8f8f8f"/>
    <stop offset="1"    stop-color="#5d5d5d"/>
  </linearGradient>
  <!-- Fuggoleges valtozat. Hosszukas alakzatoknal (fej, lab) a ferde
       atmenet ugy hat, mintha sotet sapka lenne rajtuk; a felulrol jovo
       fenyhez a fuggoleges a termeszetes. -->
  <linearGradient id="b18-volV" x1="0.42" y1="0" x2="0.58" y2="1">
    <stop offset="0"    stop-color="#e2e2e2"/>
    <stop offset="0.34" stop-color="#bdbdbd"/>
    <stop offset="0.74" stop-color="#8f8f8f"/>
    <stop offset="1"    stop-color="#5d5d5d"/>
  </linearGradient>
  <linearGradient id="b18-vol2" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0"    stop-color="#bdbdbd"/>
    <stop offset="0.5"  stop-color="#5d5d5d"/>
    <stop offset="1"    stop-color="#3b3b3b"/>
  </linearGradient>
  <!-- A membran a test fenyiranyat koveti: bal-felul vilagos. Forditva
       (sotet tetovel) a szarny fekete folttal ult a vilagos sarkanyon. -->
  <linearGradient id="b18-membrane" x1="0.12" y1="0" x2="0.78" y2="1">
    <stop offset="0"    stop-color="#bdbdbd"/>
    <stop offset="0.45" stop-color="#8f8f8f"/>
    <stop offset="1"    stop-color="#5d5d5d"/>
  </linearGradient>
  <radialGradient id="b18-sheen" cx="0.34" cy="0.24" r="0.95">
    <stop offset="0"    stop-color="#fbfbfb" stop-opacity="0.62"/>
    <stop offset="0.38" stop-color="#fbfbfb" stop-opacity="0.22"/>
    <stop offset="1"    stop-color="#fbfbfb" stop-opacity="0"/>
  </radialGradient>

</defs>
