ath d="M35.17,25.18L31.01,16.09M35.62,25.04L33.36,13.52M36.08,25L36.64,11.89M36.55,25.08L40.36,11.71M36.98,25.26L43.81,13.15M37.36,25.54L46.3,15.92M37.67,25.89L47.45,19.41M37.88,26.31L47.27,22.89" fill="none" stroke="#e2e2e2" stroke-width="0.5" opacity="0.9" stroke-linecap="round" stroke-linejoin="round"/></g></g>
</svg>